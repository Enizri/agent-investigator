[project]
name = "security-investigator"
version = "0.1.0"
description = "Local security investigation agent with hybrid retrieval and temporal verification"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "langgraph>=1.2.14",
    "pydantic-settings>=2.15.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "tqdm>=4.67.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
